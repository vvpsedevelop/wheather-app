name: Build Atmos APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.5'
          channel: 'stable'
          cache: true
      - name: Create .env from secret
        run: echo "WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}" > .env
      - name: Flutter pub get
        run: flutter pub get
      - name: Build APK universal
        run: flutter build apk --release --dart-define=WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}
      - name: Build APK split ABIs
        run: flutter build apk --release --split-per-abi --dart-define=WEATHER_API_KEY=${{ secrets.WEATHER_API_KEY }}
      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: atmos-apk-universal
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
      - name: Upload split APKs
        uses: actions/upload-artifact@v4
        with:
          name: atmos-apk-split
          path: build/app/outputs/flutter-apk/app-*-release.apk
          retention-days: 30
      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          tag_name: v1.0.${{ github.run_number }}
          name: Atmos v1.0.${{ github.run_number }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
