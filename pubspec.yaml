
name: atmos
description: Atmos - Living Weather. Premium weather app that feels more expensive than iPhone Weather.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  go_router: ^14.2.7
  dio: ^5.4.3
  retrofit: ^4.1.0
  json_annotation: ^4.9.0
  geolocator: ^10.1.0
  geocoding: ^3.0.0
  permission_handler: ^11.3.1
  hive_flutter: ^1.1.0
  hive: ^2.2.3
  flutter_svg: ^2.0.10+1
  video_player: ^2.8.6
  lottie: ^3.1.2
  shimmer: ^3.0.0
  intl: ^0.19.0
  flutter_dotenv: ^5.1.0
  path_provider: ^2.1.3
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  retrofit_generator: ^8.1.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  assets:
    - assets/icons/weather/
    - assets/videos/
    - assets/lottie/
    - .env.example
    - assets/images/
